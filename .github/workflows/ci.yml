name: project-checks
on:
  push:
  pull_request:
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_all.py
      - run: python scripts/stress_test.py --start 1 --count 100
      - run: python scripts/model_stress_test.py --start 501 --count 10 --bootstrap-reps 50
